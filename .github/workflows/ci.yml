name: SpendWise CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  verify:
    name: Lint, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Security check - No VITE_GEMINI_API_KEY in client source
        run: |
          if grep -rn "VITE_GEMINI_API_KEY" src/; then
            echo "ERROR: Phát hiện VITE_GEMINI_API_KEY trong mã nguồn Client (src/)!"
            exit 1
          fi

      - name: Run linter (oxlint)
        run: npm run lint

      - name: Run unit and API integration tests (Vitest)
        run: npm test

      - name: Build production bundle
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-placeholder-anon-key
          VITE_API_BASE_URL: http://localhost:5000
        run: npm run build

      - name: Verify production bundle contains no Gemini secrets or client SDK
        run: |
          if grep -rn "VITE_GEMINI_API_KEY\|GEMINI_API_KEY\|GoogleGenerativeAI" dist/; then
            echo "ERROR: Phát hiện thông tin Gemini API trong bundle dist/!"
            exit 1
          fi
